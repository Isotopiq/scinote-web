version: "2.4"

services:
  db:
    image: postgres:15
    container_name: scinote_db_production
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme_postgres_password
      POSTGRES_DB: scinote_production
    volumes:
      - scinote_production_postgres:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile.production
    image: scinote_web_production
    container_name: scinote_web_production
    restart: unless-stopped
    stdin_open: true
    env_file:
      - ./production.env
    depends_on:
      - db
    # Expose SciNote on port 3000 inside the container.
    # EasyPanel can then route a domain to this port.
    ports:
      - "3000:3000"
    # Persistent storage for uploaded/generated files
    volumes:
      - scinote_production_files:/usr/src/app/storage

  jobs:
    image: scinote_web_production
    container_name: scinote_jobs_production
    restart: unless-stopped
    tty: true
    env_file:
      - ./production.env
    depends_on:
      - db
    # Background job worker (as in the upstream compose file)
    command: rake jobs:work
    volumes:
      - scinote_production_files:/usr/src/app/storage

volumes:
  scinote_production_postgres:
  scinote_production_files:
