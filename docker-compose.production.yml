services:
  db:
    container_name: scinote_db_development
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 'yQ3XvM8tN1pB6kF2wL9zR4cH7sV0dJ5a'
      POSTGRES_DB: scinote_development
    volumes:
      - scinote_development_postgres:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: scinote_web_development
    container_name: scinote_web_development
    restart: unless-stopped
    stdin_open: true
    tty: true
    # Run as root so /usr/src/app (bind-mounted from EasyPanel) is writable
    user: "0:0"
    depends_on:
      - db
    ports:
      # Expose SciNote on 3534 on the host, 3000 in the container
      - "3534:3000"
    environment:
      RAILS_ENV: development
      DATABASE_URL: 'postgres://postgres:yQ3XvM8tN1pB6kF2wL9zR4cH7sV0dJ5a@db:5432/scinote_development'

      # Strong Rails secrets (you can also move these into EasyPanel env UI if you prefer)
      SECRET_KEY_BASE: 'f1f3c4a7b2d9487fb6c0d8b2e3e9a5f8d7c4a1e9b3f6c2d7a9c4b8e1f3d6a9c4f7d2b1e8c3a6d9b2e4f6c8a1b3d5e7f9'
      PAPERCLIP_HASH_SECRET: '9c4f3a6d1b8e2f7c5d9a3b1e7f2c4d8a6b3e9f1c7d2a5b9e3f6c1d4a8b2e7c5f1a3d9b6c2e4f8a1b7d3c5e9f2a4b6d8'

      # Host-related envs (only effective if wired in config)
      RAILS_DEVELOPMENT_HOSTS: 'scinote.isotopiq.com'
      APP_HOST: 'scinote.isotopiq.com'
      # If you added a DISABLE_HOST_CHECK guard in development.rb, you can flip this:
      # DISABLE_HOST_CHECK: 'true'
    command: >
      bash -c "rm -f /usr/src/app/tmp/pids/server.pid &&
               (bundle check || bundle install) &&
               yarn install &&
               bundle exec rails s -b 0.0.0.0"
    volumes:
      - .:/usr/src/app
      - scinote_development_bundler:/usr/local/bundle/
      - scinote_development_files:/usr/src/app/public/system
      - scinote_development_storage:/usr/src/app/storage

  webpack:
    build:
      context: .
      dockerfile: Dockerfile
    image: scinote_web_development
    container_name: scinote_webpack_development
    restart: unless-stopped
    stdin_open: true
    tty: true
    user: "0:0"
    command: >
      bash -c "yarn install && yarn build --watch"
    environment:
      NODE_ENV: development
    volumes:
      - .:/usr/src/app
      - scinote_development_bundler:/usr/local/bundle/
      - scinote_development_files:/usr/src/app/public/system

  css_bundling:
    build:
      context: .
      dockerfile: Dockerfile
    image: scinote_web_development
    container_name: scinote_css_bundling_development
    restart: unless-stopped
    stdin_open: true
    tty: true
    user: "0:0"
    command: >
      bash -c "yarn install && yarn build:css --watch"
    environment:
      NODE_ENV: development
    volumes:
      - .:/usr/src/app
      - scinote_development_bundler:/usr/local/bundle/
      - scinote_development_files:/usr/src/app/public/system

  tailwind:
    build:
      context: .
      dockerfile: Dockerfile
    image: scinote_web_development
    container_name: scinote_tailwind_development
    restart: unless-stopped
    stdin_open: true
    tty: true
    user: "0:0"
    command: >
      bash -c "yarn install && rails tailwindcss:watch"
    environment:
      RAILS_ENV: development
      NODE_ENV: development
    volumes:
      - .:/usr/src/app
      - scinote_development_bundler:/usr/local/bundle/
      - scinote_development_files:/usr/src/app/public/system

volumes:
  scinote_development_postgres:
  scinote_development_bundler:
  scinote_development_files:
  scinote_development_storage:
