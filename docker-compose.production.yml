services:
  db:
    container_name: scinote_db_development
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: scinote_development
    volumes:
      - scinote_development_postgres:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: scinote_web_development
    container_name: scinote_web_development
    restart: unless-stopped
    stdin_open: true
    tty: true
    # Run as root so /usr/src/app (bind-mounted from EasyPanel) is writable
    user: "0:0"
    depends_on:
      - db
    ports:
      # Expose scinote on host port 3534 -> container 3000
      - "3534:3000"
    environment:
      RAILS_ENV: development
      # Rails will also pick up DB info from POSTGRES_* but this is explicit:
      DATABASE_URL: postgres://postgres:mysecretpassword@db:5432/scinote_development
    command: >
      bash -c "rm -f /usr/src/app/tmp/pids/server.pid &&
               (bundle check || bundle install) &&
               bundle exec rails s -b 0.0.0.0"
    volumes:
      - .:/usr/src/app
      - scinote_development_bundler:/usr/local/bundle/
      - scinote_development_files:/usr/src/app/public/system
      - scinote_development_storage:/usr/src/app/storage

  webpack:
    build:
      context: .
      dockerfile: Dockerfile
    image: scinote_web_development
    container_name: scinote_webpack_development
    restart: unless-stopped
    stdin_open: true
    tty: true
    user: "0:0"
    command: >
      bash -c "yarn install && yarn build --watch"
    environment:
      NODE_ENV: development
    volumes:
      - .:/usr/src/app
      - scinote_development_bundler:/usr/local/bundle/
      - scinote_development_files:/usr/src/app/public/system

  css_bundling:
    build:
      context: .
      dockerfile: Dockerfile
    image: scinote_web_development
    container_name: scinote_css_bundling_development
    restart: unless-stopped
    stdin_open: true
    tty: true
    user: "0:0"
    command: >
      bash -c "yarn build:css --watch"
    environment:
      NODE_ENV: development
    volumes:
      - .:/usr/src/app
      - scinote_development_bundler:/usr/local/bundle/
      - scinote_development_files:/usr/src/app/public/system

  tailwind:
    build:
      context: .
      dockerfile: Dockerfile
    image: scinote_web_development
    container_name: scinote_tailwind_development
    restart: unless-stopped
    stdin_open: true
    tty: true
    user: "0:0"
    command: >
      bash -c "rails tailwindcss:watch"
    environment:
      RAILS_ENV: development
      NODE_ENV: development
    volumes:
      - .:/usr/src/app
      - scinote_development_bundler:/usr/local/bundle/
      - scinote_development_files:/usr/src/app/public/system

volumes:
  scinote_development_postgres:
  scinote_development_bundler:
  scinote_development_files:
  scinote_development_storage:
